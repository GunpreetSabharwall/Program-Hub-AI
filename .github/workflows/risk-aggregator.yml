name: Risk Aggregator
on:
  schedule:
    - cron: "0 7 * * 1,3,5"
  workflow_dispatch: {}
jobs:
  risks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests
      - name: Update program risks
        env:
          OCTO_PAT: ${{ secrets.OCTO_PAT }}
        run: python scripts/update-program-risks.py
      - name: Commit changes
        run: |
          git config user.name "program-hub-bot"
          git config user.email "program-hub-bot@users.noreply.github.com"
          git add program/PROGRAM-RISKS.md
          git diff --cached --quiet || git commit -m "chore: update program risks"
          git push
