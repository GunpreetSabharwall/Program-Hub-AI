name: Program Dashboard
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch: {}
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests
      - name: Update program dashboard
        env:
          OCTO_PAT: ${{ secrets.OCTO_PAT }}
        run: python scripts/update-program-dashboard.py
      - name: Commit changes
        run: |
          git config user.name "program-hub-bot"
          git config user.email "program-hub-bot@users.noreply.github.com"
          git add program/PROGRAM-DASHBOARD.md
          git diff --cached --quiet || git commit -m "chore: update program dashboard"
          git push
