name: Program Dashboard
# 1. AEV measures each initiative's source repo (hub mode, Feature 22)
# 2. Value pages (VALUE.md) are written from AEV's results
# 3. The program dashboard puts delivery and value side by side
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      aev_ref:
        description: "AEV version (tag or branch) to run"
        default: ""
permissions:
  contents: write   # commit the dashboard, VALUE.md and AEV's results in initiatives/*/aev/
jobs:
  dashboard:
    runs-on: ubuntu-latest
    env:
      AEV_REF: ${{ inputs.aev_ref || vars.AEV_REF || 'v0.4.0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Get the AEV engine
        uses: actions/checkout@v4
        with:
          repository: GunpreetSabharwall/agentic-earned-value
          ref: ${{ env.AEV_REF }}
          path: .aev-engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests
      - name: Run AEV on each initiative's source repo (Feature 22)
        continue-on-error: true   # a failure shows in the run; the dashboard still updates
        env:
          OCTO_PAT: ${{ secrets.OCTO_PAT || github.token }}   # must be able to read the source repos
          AEV_HOME: .aev-engine
        run: python scripts/run_aev.py
      - name: Update value pages from AEV
        continue-on-error: true
        env:
          OCTO_PAT: ${{ secrets.OCTO_PAT || github.token }}
        run: python scripts/aev_value.py
      - name: Update program dashboard
        env:
          OCTO_PAT: ${{ secrets.OCTO_PAT || github.token }}
        run: python scripts/update-program-dashboard.py
      - name: Commit changes
        run: |
          git config user.name "program-hub-bot"
          git config user.email "program-hub-bot@users.noreply.github.com"
          git add program/PROGRAM-DASHBOARD.md
          git add initiatives/*/VALUE.md 2>/dev/null || true
          git add initiatives/*/aev/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update program dashboard and AEV value"
          git push
