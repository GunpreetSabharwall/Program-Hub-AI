name: Standup Update
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}
jobs:
  standup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        initiative:
          - example-initiative
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests
      - name: Update pod standups
        env:
          OCTO_PAT: ${{ secrets.OCTO_PAT }}
        run: python scripts/update-pod-standups.py ${{ matrix.initiative }}
      - name: Commit changes
        run: |
          git config user.name "program-hub-bot"
          git config user.email "program-hub-bot@users.noreply.github.com"
          git add initiatives/${{ matrix.initiative }}/pods
          git diff --cached --quiet || git commit -m "chore: standup update for ${{ matrix.initiative }}"
          git push
