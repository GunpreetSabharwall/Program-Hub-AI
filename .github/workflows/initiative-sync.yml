name: Initiative Sync
on:
  schedule:
    - cron: "0 6 * * 5"
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        initiative:
          - example-initiative
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests
      - name: Update risk register
        env:
          OCTO_PAT: ${{ secrets.OCTO_PAT }}
        run: python scripts/update-risk-register.py ${{ matrix.initiative }}
      - name: Update status
        env:
          OCTO_PAT: ${{ secrets.OCTO_PAT }}
        run: python scripts/update-status.py ${{ matrix.initiative }}
      - name: Sync project board
        env:
          OCTO_PAT: ${{ secrets.OCTO_PAT }}
        run: python scripts/sync-project-board.py ${{ matrix.initiative }}
      - name: Commit changes
        run: |
          git config user.name "program-hub-bot"
          git config user.email "program-hub-bot@users.noreply.github.com"
          git add initiatives/${{ matrix.initiative }}
          git diff --cached --quiet || git commit -m "chore: sync ${{ matrix.initiative }} status and risk register"
          git push
