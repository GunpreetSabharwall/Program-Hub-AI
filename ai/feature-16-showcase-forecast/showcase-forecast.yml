name: Showcase Forecast
on:
  schedule:
    - cron: "45 8 * * 1"
  workflow_dispatch: {}
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests anthropic
      - name: Run showcase forecast
        env:
          OCTO_PAT: ${{ secrets.OCTO_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python ai/feature-16-showcase-forecast/showcase-forecast.py
      - name: Commit changes
        run: |
          git config user.name "program-hub-bot"
          git config user.email "program-hub-bot@users.noreply.github.com"
          git add program/PROGRAM-DASHBOARD.md
          git diff --cached --quiet || git commit -m "chore: add showcase confidence to program dashboard"
          git push
