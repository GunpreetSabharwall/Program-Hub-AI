name: Bottleneck Prediction
on:
  schedule:
    - cron: "45 6 * * 5"
  workflow_dispatch: {}
jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests anthropic
      - name: Run bottleneck prediction
        env:
          OCTO_PAT: ${{ secrets.OCTO_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python ai/feature-12-bottleneck-prediction/bottleneck-prediction.py
      - name: Commit changes
        run: |
          git config user.name "program-hub-bot"
          git config user.email "program-hub-bot@users.noreply.github.com"
          git add program/PROGRAM-RISKS.md
          git diff --cached --quiet || git commit -m "chore: add bottleneck predictions to program risks"
          git push
