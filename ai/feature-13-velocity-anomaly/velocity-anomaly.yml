name: Velocity Anomaly Detection
on:
  schedule:
    - cron: "15 8 * * 1"
  workflow_dispatch: {}
jobs:
  velocity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests anthropic
      - name: Run velocity anomaly detection
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python ai/feature-13-velocity-anomaly/velocity-anomaly.py
      - name: Commit changes
        run: |
          git config user.name "program-hub-bot"
          git config user.email "program-hub-bot@users.noreply.github.com"
          git add program/PROGRAM-DASHBOARD.md
          git diff --cached --quiet || git commit -m "chore: add velocity signal to program dashboard"
          git push
